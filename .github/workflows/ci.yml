name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the project's actual last-used toolchain (pubspec.lock
          # requires Dart >=3.8 / Flutter >=3.29; the stale .metadata said 3.19).
          # Phase 2 of the modernization plan bumps this to the latest stable.
          flutter-version: 3.32.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Formatting is reported but not yet enforced: the existing codebase
      # predates a consistent `dart format` pass. Once it is formatted
      # (Phase 2), drop `continue-on-error` to make this a hard gate.
      - name: Check formatting (non-blocking)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      # Reported but not yet enforced: the legacy codebase has pre-existing
      # analyzer/lint noise. `flutter test` (below) is the hard gate that
      # proves the app compiles and behaves. Drop `continue-on-error` to make
      # analyze blocking once the backlog is cleaned (Phase 2/3).
      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        run: flutter test
