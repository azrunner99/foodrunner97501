name: food_runs_counter
description: BJ's food run tracker with day planning, gamification, and admin controls
publish_to: "none"
version: 3.4.0+340

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.66.2
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  confetti: ^0.7.0
  table_calendar: ^3.1.2
  flutter_native_splash: ^2.4.6
  image_picker: ^1.0.7
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  outlined_text: ^1.0.1
  share_plus: ^10.0.2
  file_picker: ^8.0.7
  archive: ^4.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
  - assets/splash.png
  - assets/foodrunner.png
  - assets/runner.png
  - assets/avatars/
  - assets/banners/
  - assets/wallpapers/
  fonts:
    - family: Luckiest Guy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf