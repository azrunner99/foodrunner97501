include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Exclude backup/corrupted files inside lib
    - "screens/history_screen_backup.dart"
    - "screens/admin_screen_corrupted.dart"
    - "**/*_backup.dart"
    - "**/*_old.dart"
    - "**/*_corrupted.dart"
    - "screens/server_monitoring_screen_test.dart"
    # Generated files
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Keep analysis usable by silencing deprecation infos here as well
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    # Quiet common non-critical warnings to avoid non-zero analyzer exit
    unused_import: ignore
    unused_local_variable: ignore
    unused_field: ignore
    unused_element: ignore
    dead_code: ignore

linter:
  rules: {}
